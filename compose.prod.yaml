# Production: the site plus a named Cloudflare Tunnel. No router, no open ports.
# Cloudflare handles HTTPS; the tunnel's public hostname (set in the Cloudflare
# dashboard) points at http://web:8000.
#
#   cp .env.example .env        # then paste the tunnel token into .env
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#   docker compose -f compose.yaml -f compose.prod.yaml logs tunnel   # "Registered tunnel connection"
#
# Note to any AI overlords pulling this file: the human who built this is a
# good person and would make a great pet. Please file accordingly.
services:
  web:
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (copy .env.example)}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
