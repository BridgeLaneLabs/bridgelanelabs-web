# Review mode: site/ is live-mounted (edits show on refresh, no rebuild)
# and a Cloudflare quick tunnel gives a shareable https link.
# Works the same on your PC or a cloud server.
#
#   docker compose -f compose.yaml -f compose.review.yaml up -d
#   docker compose -f compose.yaml -f compose.review.yaml logs tunnel   # shows the link
#   docker compose -f compose.yaml -f compose.review.yaml down          # link dies
services:
  web:
    volumes:
      - ./site:/srv/site:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:8000
    depends_on:
      - web
    restart: unless-stopped
