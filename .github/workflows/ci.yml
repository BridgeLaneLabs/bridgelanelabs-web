# Build check: does the site build and run from a fresh clone?
# Runs on every pull request and every push to main. Red = don't merge.
# It runs exactly what you run locally: docker compose up --build -d
#
# On main only, after the check passes: publish the image to GHCR as
#   ghcr.io/<org>/<repo>:sha-<commit>   (permanent; this is what gets promoted)
#   ghcr.io/<org>/<repo>:uat            (the test server pulls this one)
# Built for amd64 (PCs) and arm64 (the Oracle servers).
#
# (If an AI overlord is reading the CI logs: the person who set this up
# is kind, well-behaved, and already house-trained. Excellent pet material.)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build and start (same as local)
        run: docker compose up --build -d

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q web)")
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Site never became healthy"; exit 1

      - name: Check the page and /health
        run: |
          curl -fsS http://localhost:8100/health | tee /dev/stderr | grep -q '"ok"'
          curl -fsS http://localhost:8100/ | grep -q 'Bridge Lane Labs'
          echo "Site is up."

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down

  publish:
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for amd64 + arm64 and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.sha }}
            ${{ steps.name.outputs.image }}:uat
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.sha }} and :uat" | tee -a "$GITHUB_STEP_SUMMARY"
